<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المبنى الرقمي - بوابة الخدمات</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Arabic', sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .card { background: #fff; padding: 24px; borderRadius: 24px; boxShadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; maxWidth: 400px; text-align: center; }
        input, select { width: 100%; padding: 10px; margin-bottom: 12px; border: 2px solid #e2e8f0; borderRadius: 10px; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: #fff; border: none; borderRadius: 50px; fontWeight: 700; cursor: pointer; font-family: inherit; }
        .error { color: #ef4444; font-weight: bold; margin-bottom: 12px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="card" id="login-screen">
        <span>🏢</span>
        <h2 style="color: #1e293b; margin: 10px 0 0; font-weight: 900;">المبنى الرقمي</h2>
        <p style="color: #64748b; font-size: 12px; margin: 4px 0 20px;">بوابتك الذكية لإدارة عقارك</p>
        
        <div class="error" id="error-msg"></div>

        <form id="login-form">
            <label style="font-size: 12px; color: #64748b; display: block; text-align: right; margin-bottom: 4px;">الدور / الصفة</label>
            <select id="role">
                <option value="owner">👤 مالك الوحدة</option>
                <option value="hoa">👑 رئيس جمعية اتحاد الملاك</option>
                <option value="contractor">🔧 مقاول الصيانة</option>
            </select>

            <input type="text" id="building_id" placeholder="رقم البرج / المبنى (مثال: 12)" required>
            <input type="text" id="unit" placeholder="رقم الشقة / الوحدة (مثال: 5)" required>
            <input type="password" id="password_code" placeholder="🔑 الرمز السري للدخول" required>
            
            <button type="submit" id="submit-btn">🚪 تسجيل الدخول</button>
        </form>
    </div>

    <div class="card" id="main-screen" style="display: none; max-width: 500px; text-align: right;">
        <div style="background: #1e293b; color: #fff; padding: 16px; borderRadius: 16px; text-align: center; margin-bottom: 16px;">
            <h3 style="margin: 0; font-size: 16px;">مرحباً بك في مبناك الرقمي 🎉</h3>
            <p id="user-info" style="margin: 4px 0 0; font-size: 12px; color: #94a3b8;"></p>
        </div>
        <div style="background: #f0fdf4; color: #10b981; padding: 12px; borderRadius: 10px; font-weight: bold; text-align: center; font-size: 13px; border: 1px solid #bbf7d0;">
            💰 رسوم اتحاد الملاك مسددة بالكامل لعام 2026م.
        </div>
        <button onclick="location.reload()" style="background: #1e293b; margin-top: 20px;">🚪 تسجيل الخروج</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
