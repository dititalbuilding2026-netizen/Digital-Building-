<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>المبنى الرقمي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue:#3b82f6; --indigo:#6366f1; --green:#10b981; --amber:#f59e0b;
            --red:#ef4444; --navy:#1e293b; --slate:#64748b; --border:#e2e8f0;
            --light:#f8fafc; --purple:#7c3aed;
            --safe-b:env(safe-area-inset-bottom,0px);
            --safe-t:env(safe-area-inset-top,0px);
        }
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        html{height:-webkit-fill-available}
        body{font-family:'Noto Sans Arabic',sans-serif;background:#f0f4f8;margin:0;padding:0;min-height:100vh;min-height:-webkit-fill-available;overscroll-behavior:none}

        /* ── LOGIN ── */
        .login-bg{min-height:100vh;background:linear-gradient(160deg,#0f1923,#1a2940,#0d2137);display:flex;align-items:flex-start;justify-content:center;padding:calc(var(--safe-t)+16px) 16px 24px;overflow-y:auto}
        .login-card{background:#fff;border-radius:24px;padding:28px 22px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}
        .login-logo{text-align:center;margin-bottom:20px}
        .login-logo .icon{font-size:42px;display:block;margin-bottom:6px}
        .login-logo h1{font-size:20px;font-weight:900;color:var(--navy);margin:0 0 3px}
        .login-logo p{font-size:12px;color:var(--slate);margin:0}
        .step-dots{display:flex;align-items:center;justify-content:center;gap:5px;margin-bottom:20px}
        .step-dot{height:7px;border-radius:99px;transition:all .3s}
        .type-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
        .type-btn{background:var(--light);border:2px solid var(--border);border-radius:14px;padding:12px 8px;cursor:pointer;text-align:center;font-family:inherit;transition:all .15s;min-height:86px}
        .type-btn.sel{border-color:var(--blue);background:#eff6ff}
        .type-btn .ti{font-size:26px;display:block;margin-bottom:5px}
        .type-btn .tl{font-size:11px;font-weight:700;color:var(--navy)}
        .type-btn .td{font-size:10px;color:#94a3b8;margin-top:2px}
        .role-row{display:flex;gap:7px;margin-bottom:16px}
        .role-btn{flex:1;background:var(--light);border:2px solid var(--border);border-radius:12px;padding:10px 4px;cursor:pointer;text-align:center;font-family:inherit;transition:all .15s}
        .role-btn.sel{border-color:var(--purple);background:#f5f3ff}
        .role-btn .ri{font-size:20px;display:block;margin-bottom:3px}
        .role-btn .rl{font-size:10px;font-weight:700;color:var(--navy)}
        .f-group{margin-bottom:10px}
        .f-label{font-size:11px;font-weight:700;color:var(--slate);display:block;margin-bottom:4px}
        .f-input{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:12px;font-family:inherit;font-size:16px;outline:none;transition:border .2s;background:#fff;-webkit-appearance:none;margin-bottom:10px}
        .f-input:focus{border-color:var(--blue)}
        .f-input:last-child{margin-bottom:0}
        textarea.f-input{resize:vertical;min-height:76px;font-size:14px}
        .lang-btn{position:fixed;top:calc(var(--safe-t)+12px);left:14px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:7px 14px;border-radius:30px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;z-index:999;touch-action:manipulation}

        /* ── BUTTONS ── */
        .btn{width:100%;padding:14px;border:none;border-radius:50px;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px;transition:all .15s;touch-action:manipulation}
        .btn:active{transform:scale(.97)}
        .btn-primary{background:linear-gradient(135deg,var(--blue),var(--indigo));color:#fff;box-shadow:0 6px 20px rgba(99,102,241,.3)}
        .btn-green{background:linear-gradient(135deg,var(--green),#059669);color:#fff}
        .btn-amber{background:linear-gradient(135deg,var(--amber),#d97706);color:#fff}
        .btn-red{background:linear-gradient(135deg,var(--red),#dc2626);color:#fff}
        .btn-ghost{background:var(--light);border:2px solid var(--border);color:var(--slate)}
        .btn-sm{width:auto;padding:8px 16px;font-size:12px;border-radius:10px}
        .back-btn{background:none;border:none;cursor:pointer;color:var(--slate);font-family:inherit;font-size:13px;display:flex;align-items:center;gap:4px;padding:0;margin-bottom:16px;font-weight:600;min-height:44px}
        .pill{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:700}

        /* ── APP SHELL ── */
        .app-shell{min-height:100vh;background:#f0f4f8}
        .top-nav{background:var(--navy);padding:calc(var(--safe-t)+10px) 14px 10px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 14px rgba(0,0,0,.2)}
        .nav-brand{display:flex;align-items:center;gap:7px;color:#fff;font-weight:800;font-size:14px;min-width:0}
        .nav-badge{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;flex-shrink:0}
        .nav-logout{background:rgba(239,68,68,.18);border:none;color:#f87171;padding:8px 14px;border-radius:20px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;touch-action:manipulation;flex-shrink:0}
        .content{padding:14px;max-width:560px;margin:0 auto;padding-bottom:calc(68px + var(--safe-b) + 8px)}
        .bottom-nav{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid #e8ecf0;display:flex;z-index:99;padding-bottom:var(--safe-b);box-shadow:0 -3px 16px rgba(0,0,0,.08)}
        .btab{flex:1;padding:9px 2px 10px;border:none;background:none;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;color:#94a3b8;transition:color .15s;touch-action:manipulation;min-height:54px}
        .btab.on{color:var(--blue)}
        .btab.on .ti2{transform:scale(1.12)}
        .btab .ti2{font-size:20px;transition:transform .15s}

        /* ── CARDS ── */
        .card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.055);margin-bottom:12px;overflow:hidden}
        .ch{padding:14px 16px;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center}
        .ch h3{margin:0;font-size:13px;font-weight:700;color:var(--navy)}
        .cb{padding:14px 16px}
        .hero{border-radius:16px;padding:18px 16px;margin-bottom:12px;color:#fff;position:relative;overflow:hidden}
        .hero h2{margin:0 0 3px;font-size:17px;font-weight:800}
        .hero p{margin:0;font-size:12px;opacity:.7}
        .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
        .stat{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.05);border-top:3px solid}
        .stat .si{font-size:20px;margin-bottom:7px;display:block}
        .stat .sv{font-size:22px;font-weight:800;display:block}
        .stat .sl{font-size:10px;color:var(--slate);margin-top:2px}

        /* ── LIST ── */
        .li{padding:12px 16px;border-bottom:1px solid #f5f7fa;display:flex;justify-content:space-between;align-items:center;gap:8px}
        .li:last-child{border-bottom:none}
        .li-l{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
        .lic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
        .lit{font-size:13px;font-weight:600;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
        .lis{font-size:11px;color:#94a3b8;margin-top:1px}

        /* ── BADGES ── */
        .badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0}
        .bg-g{background:#dcfce7;color:#16a34a}
        .bg-a{background:#fef3c7;color:#d97706}
        .bg-r{background:#fee2e2;color:#dc2626}
        .bg-b{background:#eff6ff;color:var(--blue)}
        .bg-s{background:#f1f5f9;color:var(--slate)}
        .bg-p{background:#f5f3ff;color:var(--purple)}

        /* ── ALERTS ── */
        .alert{padding:12px 14px;border-radius:12px;font-size:13px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
        .alert-success{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
        .alert-error{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
        .alert-info{background:#eff6ff;color:var(--blue);border:1px solid #bfdbfe}

        /* ── MISC ── */
        .tab-row{display:flex;gap:4px;background:#fff;border-radius:14px;padding:5px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
        .tbtn{flex:1;padding:9px;border:none;background:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;color:#94a3b8;border-radius:10px;transition:all .15s;touch-action:manipulation}
        .tbtn.on{background:var(--navy);color:#fff}
        .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
        .chip{background:var(--light);border:1px solid var(--border);border-radius:20px;padding:7px 14px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--slate);transition:all .15s;touch-action:manipulation}
        .chip.on{background:#fef3c7;border-color:var(--amber);color:#d97706}
        .chip:active{transform:scale(.95)}
        .prog-wrap{background:#f1f5f9;border-radius:99px;height:8px;overflow:hidden}
        .prog-bar{height:100%;border-radius:99px;transition:width .5s}
        .empty{text-align:center;padding:28px 16px;color:#94a3b8}
        .empty .ei{font-size:40px;display:block;margin-bottom:8px}
        .empty p{font-size:13px;margin:0}
        .section-title{font-size:12px;font-weight:700;color:var(--slate);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.5px}

        /* ── DOCUMENTS ── */
        .doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
        .doc-card{background:#fff;border-radius:14px;padding:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;transition:all .15s;border:2px solid transparent}
        .doc-card:hover{border-color:var(--blue);transform:translateY(-2px)}
        .doc-card:active{transform:scale(.97)}
        .doc-icon{font-size:32px;margin-bottom:8px;display:block}
        .doc-name{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:4px}
        .doc-type{font-size:10px;color:#94a3b8;background:var(--light);padding:3px 8px;border-radius:20px;display:inline-block}

        /* ── COLOR SWATCHES ── */
        .color-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
        .color-swatch{border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.08)}
        .swatch-color{height:60px}
        .swatch-info{background:#fff;padding:8px;font-size:10px}
        .swatch-name{font-weight:700;color:var(--navy)}
        .swatch-code{color:#94a3b8;margin-top:1px}

        /* ── NOTIFICATIONS ── */
        .notif-item{padding:14px 16px;border-bottom:1px solid #f5f7fa;display:flex;gap:12px;align-items:flex-start}
        .notif-item:last-child{border-bottom:none}
        .notif-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:4px}
        .notif-dot.read{background:#e2e8f0}
        .notif-text{font-size:13px;color:var(--navy);font-weight:600;margin-bottom:3px}
        .notif-time{font-size:11px;color:#94a3b8}

        /* ── OWNERSHIP TRANSFER ── */
        .transfer-steps{display:flex;flex-direction:column;gap:10px}
        .transfer-step{background:var(--light);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start}
        .step-num{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
        .step-text{font-size:13px;color:var(--navy);font-weight:600}
        .step-sub{font-size:11px;color:var(--slate);margin-top:2px}

        /* ── FEES ── */
        .fee-card{background:linear-gradient(135deg,var(--navy),#334155);border-radius:16px;padding:20px;color:#fff;margin-bottom:12px}
        .fee-amount{font-size:32px;font-weight:900;margin:4px 0}
        .fee-label{font-size:12px;opacity:.6}
        .fee-status{background:rgba(16,185,129,.25);color:#6ee7b7;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block;margin-top:8px}
    </style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect } = React;
const ce = React.createElement;

const sb = window.supabase.createClient(
    'https://qfdkuzlndzlydcrwboqi.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmZGt1emxuZHpseWRjcndib3FpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NTU2OTQsImV4cCI6MjA5NTAzMTY5NH0.WYx5xRSifld6Bd45dBzuX_1gnUkeM0fhQOiH1QguWtY'
);

// ── helpers ──────────────────────────────────────────────────────────────
function Badge({cls,txt}){ return ce('span',{className:`badge ${cls}`},txt); }
function Alert({type,msg,onClose}){
    if(!msg) return null;
    return ce('div',{className:`alert alert-${type}`},
        ce('span',null,msg),
        onClose&&ce('span',{onClick:onClose,style:{cursor:'pointer',fontSize:18}},'×')
    );
}
function Empty({icon,txt}){
    return ce('div',{className:'empty'},ce('span',{className:'ei'},icon),ce('p',null,txt));
}
function SectionTitle({txt}){ return ce('div',{className:'section-title'},txt); }

// ─────────────────────────────────────────────────────────────────────────
// LOGIN FLOW
// ─────────────────────────────────────────────────────────────────────────
function LoginFlow({onLogin}){
    const [lang,setLang]=useState('ar');
    const [step,setStep]=useState(1);
    const [ptype,setPtype]=useState(null);
    const [role,setRole]=useState(null);
    const [form,setForm]=useState({building_id:'',unit:'',password_code:''});
    const [loading,setLoading]=useState(false);
    const [err,setErr]=useState('');

    const T={
        ar:{
            app:'المبنى الرقمي',sub:'بوابتك الذكية لإدارة عقارك',
            s1:'نوع العقار',s2:'دورك',s3:'بيانات الدخول',
            types:{
                building:{l:'عمارة سكنية',d:'شقق في عمارة',i:'🏢'},
                compound:{l:'مجمع/كمباوند',d:'وحدات في مجمع',i:'🏘️'},
                villa:{l:'فيلا',d:'فيلا مستقلة',i:'🏡'},
                townhouse:{l:'تاون هاوس',d:'وحدة مستقلة',i:'🏠'},
            },
            roles:{owner:{l:'مالك وحدة',i:'🏠'},hoa:{l:'رئيس الاتحاد',i:'👑'},contractor:{l:'مقاول',i:'🔧'}},
            bld:'رقم / اسم المبنى',cmp:'اسم المجمع',unit:'رقم الوحدة',
            pass:'الرمز السري',user:'اسم المستخدم',
            next:'التالي →',back:'رجوع',enter:'دخول',
            e1:'يرجى إدخال جميع الحقول',e2:'بيانات غير صحيحة',forgot:'نسيت الرمز؟',
        },
        en:{
            app:'Digital Building',sub:'Smart property management portal',
            s1:'Property Type',s2:'Your Role',s3:'Login Details',
            types:{
                building:{l:'Apartment Bldg',d:'Units in building',i:'🏢'},
                compound:{l:'Compound',d:'Units in compound',i:'🏘️'},
                villa:{l:'Villa',d:'Standalone villa',i:'🏡'},
                townhouse:{l:'Townhouse',d:'Townhouse unit',i:'🏠'},
            },
            roles:{owner:{l:'Unit Owner',i:'🏠'},hoa:{l:'HOA President',i:'👑'},contractor:{l:'Contractor',i:'🔧'}},
            bld:'Building Name/No.',cmp:'Compound Name',unit:'Unit Number',
            pass:'Password/Code',user:'Username',
            next:'Next →',back:'Back',enter:'Sign In',
            e1:'Please fill all fields',e2:'Invalid credentials',forgot:'Forgot code?',
        }
    };
    const t=T[lang];
    const TC={building:'#3b82f6',compound:'#6366f1',villa:'#10b981',townhouse:'#f59e0b'};
    const RC={owner:'#3b82f6',hoa:'#7c3aed',contractor:'#10b981'};
    const tc=TC[ptype]||'#3b82f6', rc=RC[role]||'#3b82f6';

    const Dots=()=>ce('div',{className:'step-dots'},
        ...[1,2,3].map(n=>ce('div',{key:n,style:{display:'flex',alignItems:'center',gap:5}},
            ce('div',{className:'step-dot',style:{width:step===n?26:step>n?12:9,background:step>n?'#10b981':step===n?tc:'#e2e8f0'}}),
            n<3&&ce('div',{style:{width:14,height:3,borderRadius:99,background:step>n?'#10b981':'#e2e8f0',transition:'background .3s'}})
        ))
    );

    const doLogin=async()=>{
        if(!form.building_id||!form.password_code){setErr(t.e1);return;}
        if(role==='owner'&&!form.unit){setErr(t.e1);return;}
        setLoading(true);setErr('');
        try{
            let q=sb.from('building_accounts').select('*')
                .eq('building_id',form.building_id.trim())
                .eq('password_code',form.password_code.trim())
                .eq('role',role);
            if(role==='owner') q=q.eq('unit',form.unit.trim());
            const{data}=await q;
            if(data&&data.length>0) onLogin({...data[0],property_type:ptype,lang});
            else setErr(t.e2);
        }catch{setErr('Connection error');}
        setLoading(false);
    };

    return ce('div',{className:'login-bg'},
        ce('button',{className:'lang-btn',onClick:()=>setLang(lang==='ar'?'en':'ar')},lang==='ar'?'EN':'ع'),
        ce('div',{className:'login-card'},
            ce('div',{className:'login-logo'},
                ce('span',{className:'icon'},'🏢'),
                ce('h1',null,t.app),
                ce('p',null,t.sub)
            ),
            ce(Dots),
            step===1&&ce('div',null,
                ce('p',{style:{margin:'0 0 12px',fontSize:13,fontWeight:700,color:var_navy}},'اختر نوع عقارك'),
                ce('div',{className:'type-grid'},
                    ...Object.entries(t.types).map(([k,v])=>
                        ce('button',{key:k,className:`type-btn ${ptype===k?'sel':''}`,
                            style:{borderColor:ptype===k?TC[k]:'#e2e8f0',background:ptype===k?TC[k]+'15':'#f8fafc'},
                            onClick:()=>setPtype(k)},
                            ce('span',{className:'ti'},v.i),
                            ce('div',{className:'tl'},v.l),
                            ce('div',{className:'td'},v.d)
                        )
                    )
                ),
                ptype&&ce('button',{className:'btn btn-primary',style:{background:`linear-gradient(135deg,${tc},${tc}bb)`},onClick:()=>setStep(2)},t.next)
            ),
            step===2&&ce('div',null,
                ce('button',{className:'back-btn',onClick:()=>setStep(1)},'→ '+t.back),
                ce('p',{style:{margin:'0 0 12px',fontSize:13,fontWeight:700,color:'#1e293b'}},t.s2),
                ce('div',{className:'role-row'},
                    ...Object.entries(t.roles).map(([k,v])=>
                        ce('button',{key:k,className:`role-btn ${role===k?'sel':''}`,
                            style:{borderColor:role===k?RC[k]:'#e2e8f0',background:role===k?RC[k]+'12':'#f8fafc'},
                            onClick:()=>setRole(k)},
                            ce('span',{className:'ri'},v.i),
                            ce('div',{className:'rl'},v.l)
                        )
                    )
                ),
                role&&ce('button',{className:'btn btn-primary',style:{background:`linear-gradient(135deg,${rc},${rc}bb)`},onClick:()=>setStep(3)},t.next)
            ),
            step===3&&ce('div',null,
                ce('button',{className:'back-btn',onClick:()=>setStep(2)},'→ '+t.back),
                ce('div',{style:{display:'flex',gap:6,flexWrap:'wrap',marginBottom:14}},
                    ce('span',{className:'pill',style:{background:tc+'18',color:tc}},t.types[ptype]?.i+' '+t.types[ptype]?.l),
                    ce('span',{className:'pill',style:{background:rc+'15',color:rc}},t.roles[role]?.i+' '+t.roles[role]?.l)
                ),
                err&&ce(Alert,{type:'error',msg:err,onClose:()=>setErr('')}),
                ce('div',{className:'f-group'},
                    ce('label',{className:'f-label'},ptype==='compound'?t.cmp:t.bld),
                    ce('input',{className:'f-input',value:form.building_id,onChange:e=>setForm({...form,building_id:e.target.value}),placeholder:'مثال: برج الياسمين'})
                ),
                role==='owner'&&ce('div',{className:'f-group'},
                    ce('label',{className:'f-label'},t.unit),
                    ce('input',{className:'f-input',value:form.unit,onChange:e=>setForm({...form,unit:e.target.value}),placeholder:'مثال: C-206'})
                ),
                ce('div',{className:'f-group'},
                    ce('label',{className:'f-label'},role==='contractor'?t.user:t.pass),
                    ce('input',{type:'password',className:'f-input',value:form.password_code,onChange:e=>setForm({...form,password_code:e.target.value}),placeholder:'🔑',onKeyDown:e=>e.key==='Enter'&&doLogin()})
                ),
                ce('div',{style:{textAlign:'left',marginBottom:14}},
                    ce('span',{style:{color:'#3b82f6',fontSize:12,cursor:'pointer',fontWeight:600}},t.forgot)
                ),
                ce('button',{className:'btn btn-primary',onClick:doLogin,disabled:loading,
                    style:{background:`linear-gradient(135deg,${rc},${tc})`}},
                    loading?'⏳ جاري التحقق...':t.enter
                )
            )
        )
    );
}

const var_navy='#1e293b';

// ─────────────────────────────────────────────────────────────────────────
// MAIN APP
// ─────────────────────────────────────────────────────────────────────────
function App(){
    const [user,setUser]=useState(null);
    const [tab,setTab]=useState('home');
    const [tickets,setTickets]=useState([]);
    const [votes,setVotes]=useState([]);
    const [voted,setVoted]=useState({});
    const [managed,setManaged]=useState([]);
    const [visitorLog,setVisitorLog]=useState([]);
    const [visitorType,setVisitorType]=useState('visitor');
    const [vForm,setVForm]=useState({name:'',plate:'',note:''});
    const [tForm,setTForm]=useState({title:'',description:''});
    const [hoaForm,setHoaForm]=useState({unit:'',password_code:'',role:'owner'});
    const [notif,setNotif]=useState({type:'',msg:''});
    const [reports,setReports]=useState([]);
    const [rForm,setRForm]=useState({title:'',description:'',work_date:'',amount:'',invoice_note:'',invoice_url:''});
    const [notifications,setNotifications]=useState([
        {id:1,text:'تم الموافقة على طلب صيانة المصعد',time:'منذ ساعة',read:false},
        {id:2,text:'جدول الصيانة الشهرية: يوم الجمعة 9 صباحاً',time:'منذ 3 ساعات',read:false},
        {id:3,text:'تم نشر تصويت جديد: تجديد عقد النظافة',time:'أمس',read:true},
        {id:4,text:'تم تحديث لائحة المبنى الداخلية',time:'قبل يومين',read:true},
    ]);

    const toast=(type,msg)=>{setNotif({type,msg});setTimeout(()=>setNotif({type:'',msg:''}),3500);};

    const load=u=>{
        sb.from('building_tickets').select('*').eq('building_id',u.building_id).order('created_at',{ascending:false}).then(r=>r.data&&setTickets(r.data));
        sb.from('building_votes').select('*').eq('building_id',u.building_id).order('created_at',{ascending:false}).then(r=>r.data&&setVotes(r.data));
        sb.from('maintenance_reports').select('*').eq('building_id',u.building_id).order('created_at',{ascending:false}).then(r=>r.data&&setReports(r.data));
        if(u.role==='hoa'){
            sb.from('building_accounts').select('*').eq('created_by',u.password_code).then(r=>r.data&&setManaged(r.data));
            sb.from('visitor_requests').select('*').eq('building_id',u.building_id).order('created_at',{ascending:false}).limit(50).then(r=>r.data&&setVisitorLog(r.data));
        }
        if(u.role==='owner') sb.from('visitor_requests').select('*').eq('building_id',u.building_id).eq('unit',u.unit||'').order('created_at',{ascending:false}).limit(20).then(r=>r.data&&setVisitorLog(r.data));
    };

    const handleLogin=u=>{setUser(u);load(u);};
    const handleLogout=()=>{setUser(null);setTab('home');setTickets([]);setVotes([]);setManaged([]);setVisitorLog([]);};

    const sendTicket=async e=>{
        e.preventDefault();
        if(!tForm.title) return;
        await sb.from('building_tickets').insert([{building_id:user.building_id,unit:user.unit||'عامة',title:tForm.title,description:tForm.description,status:'pending'}]);
        toast('success','✅ تم إرسال البلاغ!');
        setTForm({title:'',description:''});
        load(user);
    };

    const createAcc=async e=>{
        e.preventDefault();
        if(managed.length>=(user.allowed_units||0)){toast('error','⚠️ استهلكت كل الوحدات');return;}
        await sb.from('building_accounts').insert([{building_id:user.building_id,unit:hoaForm.unit,password_code:hoaForm.password_code,role:hoaForm.role,created_by:user.password_code}]);
        toast('success','🎉 تم إنشاء الحساب!');
        setHoaForm({unit:'',password_code:'',role:'owner'});
        load(user);
    };

    const castVote=async(vid,opt)=>{
        if(voted[vid]) return;
        await sb.from('vote_responses').insert([{vote_id:vid,unit:user.unit||'مدير',selected_option:opt}]);
        setVoted(p=>({...p,[vid]:opt}));
        toast('success','🗳️ تم تسجيل تصويتك!');
    };

    const sendVisitor=async e=>{
        e.preventDefault();
        const name=visitorType==='delivery'?(vForm.name||'ديلفري'):vForm.name;
        if(!name&&visitorType!=='preapproved'){toast('error','أدخل اسم الزائر');return;}
        await sb.from('visitor_requests').insert([{building_id:user.building_id,unit:user.unit||'—',visitor_name:name||'مسموح مسبقاً',visitor_type:visitorType,plate:vForm.plate||null,note:vForm.note||null,status:'pending'}]);
        toast('success','📲 تم إرسال الطلب!');
        setVForm({name:'',plate:'',note:''});
        load(user);
    };

    const updateVisitor=async(id,status)=>{
        await sb.from('visitor_requests').update({status}).eq('id',id);
        toast('success',status==='approved'?'✅ تم السماح':'✗ تم الرفض');
        load(user);
    };

    const markAllRead=()=>setNotifications(p=>p.map(n=>({...n,read:true})));

    if(!user) return ce(LoginFlow,{onLogin:handleLogin});

    const RC={owner:'#3b82f6',hoa:'#7c3aed',contractor:'#10b981'};

            ce('p',null,`${user.building_id} · ${roleLabel}`)
        ),
        ce('div',{className:'stats-grid'},
            ...[
                {icon:'🔧',val:tickets.length,lbl:'طلبات الصيانة',c:'#3b82f6'},
                {icon:pendingT?'⏳':'✅',val:pendingT,lbl:'معلقة',c:pendingT?'#ef4444':'#10b981'},
                {icon:'🗳️',val:votes.length,lbl:'تصويتات',c:'#6366f1'},

                ce('div',{className:'sl'},s.lbl)
            ))
        ),
        // إشعارات
        unreadN>0&&ce('div',{className:'card'},
            ce('div',{className:'ch'},
                ce('h3',null,'🔔 إشعارات جديدة'),
                ce('button',{onClick:markAllRead,style:{background:'#eff6ff',color:'#3b82f6',border:'none',borderRadius:8,padding:'5px 10px',cursor:'pointer',fontFamily:'inherit',fontSize:11,fontWeight:700}},'تعليم كمقروء')
            ),
            ...notifications.filter(n=>!n.read).slice(0,3).map(n=>ce('div',{key:n.id,className:'notif-item'},
                ce('div',{className:`notif-dot ${n.read?'read':''}`}),

                    ce('div',{className:'notif-text'},n.text),
                    ce('div',{className:'notif-time'},n.time)

        // آخر الطلبات

                ce('h3',null,'🔧 آخر الطلبات'),
                ce('button',{onClick:()=>setTab('ticket'),style:{background:'#eff6ff',color:'#3b82f6',border:'none',borderRadius:8,padding:'5px 10px',cursor:'pointer',fontFamily:'inherit',fontSize:11,fontWeight:700}},`عرض الكل (${tickets.length})`)

                ce('div',{style:{display:'flex',gap:8}},
                    ce('button',{style:{flex:1,padding:12,background:'#dcfce7',color:'#16a34a',border:'none',borderRadius:10,cursor:'pointer',fontFamily:'inherit',fontWeight:700,fontSize:13},onClick:()=>castVote(votes.find(v=>!voted[v.id]).id,'موافق')},'👍 موافق'),

                ?ce(Empty,{icon:'👥',txt:'لا توجد طلبات بعد'})
                :visitorLog.map(v=>ce('div',{key:v.id,className:'li'},
                    ce('div',{className:'li-l'},
                        ce('div',{className:'lic',style:{background:{visitor:'#eff6ff',delivery:'#fef3c7',service:'#f5f3ff',preapproved:'#dcfce7'}[v.visitor_type]||'#eff6ff'}},{visitor:'👤',delivery:'📦',service:'🔧',preapproved:'✅'}[v.visitor_type]||'👤'),
                        ce('div',null,
                            ce('div',{className:'lit'},v.visitor_name),
                            ce('div',{className:'lis'},new Date(v.created_at).toLocaleString('ar',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})+(v.plate?' · 🚗 '+v.plate:''))
                        )
                    ),
                    ce(Badge,{cls:v.status==='approved'?'bg-g':v.status==='rejected'?'bg-r':'bg-a',txt:v.status==='approved'?'✓ مسموح':v.status==='rejected'?'✗ مرفوض':'⏳ ينتظر'})
                ))
        )
    );

    // ── SECURITY (HOA) ──────────────────────────────────────────────────
    const SecurityTab=()=>{
        const done=visitorLog.filter(v=>v.status!=='pending');
        return ce('div',null,
            ce('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,marginBottom:12}},
                ...[{n:visitorLog.length,l:'إجمالي',c:'#3b82f6'},{n:pendingV.length,l:'ينتظر',c:'#f59e0b'},{n:done.filter(v=>v.status==='approved').length,l:'مسموح',c:'#10b981'}].map((s,i)=>
                    ce('div',{key:i,style:{background:'#fff',borderRadius:14,padding:'12px',textAlign:'center',boxShadow:'0 2px 8px rgba(0,0,0,.05)',borderTop:`3px solid ${s.c}`}},
                        ce('div',{style:{fontSize:22,fontWeight:800,color:s.c}},s.n),
                        ce('div',{style:{fontSize:10,color:'#64748b',marginTop:2}},s.l)
                    )
                )
            ),
            pendingV.length>0&&ce('div',{className:'card'},
                ce('div',{className:'ch'},ce('h3',null,'🔴 تحتاج موافقة'),ce('button',{onClick:()=>load(user),style:{background:'#eff6ff',color:'#3b82f6',border:'none',borderRadius:8,padding:'5px 10px',cursor:'pointer',fontFamily:'inherit',fontSize:11,fontWeight:700}},'🔄')),
                ...pendingV.map(v=>ce('div',{key:v.id,style:{padding:'14px 16px',borderBottom:'1px solid #f5f7fa'}},
                    ce('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:10}},
                        ce('div',{className:'lic',style:{background:{visitor:'#eff6ff',delivery:'#fef3c7',service:'#f5f3ff'}[v.visitor_type]||'#eff6ff'}},{visitor:'👤',delivery:'📦',service:'🔧'}[v.visitor_type]||'👤'),
                        ce('div',null,
                            ce('div',{style:{fontSize:14,fontWeight:700,color:'#1e293b'}},v.visitor_name),
                            ce('div',{style:{fontSize:11,color:'#64748b',marginTop:1}},`وحدة ${v.unit}`+(v.plate?' · 🚗 '+v.plate:'')+(v.note?' · '+v.note:''))
                        )
                    ),
                    ce('div',{style:{display:'flex',gap:8}},
                        ce('button',{onClick:()=>updateVisitor(v.id,'approved'),style:{flex:1,padding:11,background:'linear-gradient(135deg,#10b981,#059669)',color:'#fff',border:'none',borderRadius:10,cursor:'pointer',fontFamily:'inherit',fontWeight:700,fontSize:13}},'✓ السماح'),
                        ce('button',{onClick:()=>updateVisitor(v.id,'rejected'),style:{flex:1,padding:11,background:'#fee2e2',color:'#dc2626',border:'none',borderRadius:10,cursor:'pointer',fontFamily:'inherit',fontWeight:700,fontSize:13}},'✗ رفض')
                    )
                ))
            ),
            done.length>0&&ce('div',{className:'card'},
                ce('div',{className:'ch'},ce('h3',null,'📋 السجل')),
                ...done.slice(0,15).map(v=>ce('div',{key:v.id,className:'li'},
                    ce('div',{className:'li-l'},
                        ce('div',{className:'lic',style:{background:v.status==='approved'?'#dcfce7':'#fee2e2'}},v.status==='approved'?'✅':'❌'),
                        ce('div',null,
                            ce('div',{className:'lit'},v.visitor_name),
                            ce('div',{className:'lis'},`وحدة ${v.unit} · `+new Date(v.created_at).toLocaleString('ar',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}))
                        )
                    ),
                    ce(Badge,{cls:v.status==='approved'?'bg-g':'bg-r',txt:v.status==='approved'?'✓ مسموح':'✗ مرفوض'})
                ))
            ),
            !pendingV.length&&!done.length&&ce(Empty,{icon:'🛡️',txt:'لا توجد طلبات دخول'})
        );
    };


    const sendReport=async e=>{
        e.preventDefault();
        if(!rForm.title||!rForm.amount){toast('error','يرجى إدخال العنوان والمبلغ');return;}
        await sb.from('maintenance_reports').insert([{
            building_id:user.building_id,
            contractor_unit:user.unit||'مقاول',
            title:rForm.title,
            description:rForm.description,
            work_date:rForm.work_date||null,
            amount:parseFloat(rForm.amount)||0,
            invoice_note:rForm.invoice_note||null,
            status:'pending',
        }]);
        toast('success','📋 تم رفع التقرير — في انتظار موافقة رئيس الاتحاد');
        setRForm({title:'',description:'',work_date:'',amount:'',invoice_note:'',invoice_url:''});
        load(user);
    };

    const approveReport=async(id)=>{
        await sb.from('maintenance_reports').update({status:'approved',approved_by:user.unit||'هيئة الاتحاد'}).eq('id',id);
        toast('success','✅ تمت الموافقة — ستظهر للجميع الآن');
        load(user);
    };

    // ── MAINTENANCE REPORTS (فواتير الصيانة) ────────────────────────────────
    const MReportsTab=()=>{
        const approved=reports.filter(r=>r.status==='approved');
        const pending_r=reports.filter(r=>r.status==='pending');
        const totalSpent=approved.reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
        return ce('div',null,
            // ملخص مالي — يشوفه الجميع
            ce('div',{style:{background:'linear-gradient(135deg,#1e293b,#334155)',borderRadius:16,padding:20,marginBottom:12,color:'#fff'}},
                ce('div',{style:{fontSize:12,opacity:.6,marginBottom:4}},'إجمالي مصاريف الصيانة — '+user.building_id),
                ce('div',{style:{fontSize:32,fontWeight:900,marginBottom:4}},totalSpent.toLocaleString()+' ريال'),
                ce('div',{style:{display:'flex',gap:12,marginTop:10}},
                    ce('div',{style:{background:'rgba(16,185,129,.2)',borderRadius:10,padding:'8px 14px',fontSize:12,color:'#6ee7b7'}},approved.length+' فاتورة مُعتمدة'),
                    pending_r.length>0&&ce('div',{style:{background:'rgba(245,158,11,.2)',borderRadius:10,padding:'8px 14px',fontSize:12,color:'#fcd34d'}},pending_r.length+' بانتظار الموافقة')
                )
            ),
            // المقاول — رفع تقرير جديد
            user.role==='contractor'&&ce('div',{className:'card'},
                ce('div',{className:'ch'},ce('h3',null,'📋 رفع تقرير صيانة جديد')),
                ce('div',{className:'cb'},
                    ce('form',{onSubmit:sendReport},
                        ce('input',{className:'f-input',value:rForm.title,onChange:e=>setRForm({...rForm,title:e.target.value}),placeholder:'عنوان العمل (مثال: تنظيف خزانات المياه)...',required:true}),
                        ce('textarea',{className:'f-input',value:rForm.description,onChange:e=>setRForm({...rForm,description:e.target.value}),placeholder:'وصف تفصيلي للعمل المنجز...'}),
                        ce('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}},
                            ce('div',null,
                                ce('label',{className:'f-label'},'تاريخ تنفيذ العمل'),
                                ce('input',{className:'f-input',type:'date',value:rForm.work_date,onChange:e=>setRForm({...rForm,work_date:e.target.value})})
                            ),
                            ce('div',null,
                                ce('label',{className:'f-label'},'المبلغ (ريال)'),
                                ce('input',{className:'f-input',type:'number',value:rForm.amount,onChange:e=>setRForm({...rForm,amount:e.target.value}),placeholder:'0',required:true})
                            )
                        ),
                        ce('input',{className:'f-input',value:rForm.invoice_note,onChange:e=>setRForm({...rForm,invoice_note:e.target.value}),placeholder:'رقم الفاتورة أو ملاحظات الدفع...'}),
                        ce('div',{style:{border:'2px dashed #e2e8f0',borderRadius:12,padding:16,textAlign:'center',marginBottom:10,cursor:'pointer',color:'#64748b'}},
                            ce('div',{style:{fontSize:28,marginBottom:4}},'📎'),
                            ce('div',{style:{fontSize:13,fontWeight:600}},'رفع صورة الفاتورة'),
                            ce('div',{style:{fontSize:11,color:'#94a3b8',marginTop:2}},'JPG, PNG, PDF')
                        ),
                        ce('button',{type:'submit',className:'btn btn-green'},'📤 رفع التقرير للموافقة')
                    )
                )
            ),
            // رئيس الاتحاد — موافقة على التقارير المعلقة
            user.role==='hoa'&&pending_r.length>0&&ce('div',{className:'card'},
                ce('div',{className:'ch'},ce('h3',null,'⏳ تحتاج موافقتك'),ce('span',{className:'badge bg-a'},pending_r.length)),
                ...pending_r.map(r=>ce('div',{key:r.id,style:{padding:'14px 16px',borderBottom:'1px solid #f5f7fa'}},
                    ce('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}},
                        ce('div',null,
                            ce('div',{style:{fontSize:13,fontWeight:700,color:'#1e293b',marginBottom:3}},r.title),
                            ce('div',{style:{fontSize:12,color:'#64748b'}},r.description||'—'),
                            ce('div',{style:{display:'flex',gap:8,marginTop:6}},
                                ce('span',{style:{background:'#eff6ff',color:'#3b82f6',padding:'3px 10px',borderRadius:20,fontSize:11,fontWeight:700}},parseFloat(r.amount||0).toLocaleString()+' ريال'),
                                r.work_date&&ce('span',{style:{background:'#f1f5f9',color:'#64748b',padding:'3px 10px',borderRadius:20,fontSize:11}},r.work_date),
                                r.invoice_note&&ce('span',{style:{background:'#fef3c7',color:'#d97706',padding:'3px 10px',borderRadius:20,fontSize:11}},r.invoice_note)
                            )
                        )
                    ),
                    ce('div',{style:{display:'flex',gap:8}},
                        ce('button',{onClick:()=>approveReport(r.id),style:{flex:1,padding:10,background:'linear-gradient(135deg,#10b981,#059669)',color:'#fff',border:'none',borderRadius:10,cursor:'pointer',fontFamily:'inherit',fontWeight:700,fontSize:13}},'✓ اعتماد — تظهر للجميع'),
                        ce('button',{style:{padding:'10px 16px',background:'#fee2e2',color:'#dc2626',border:'none',borderRadius:10,cursor:'pointer',fontFamily:'inherit',fontWeight:700,fontSize:13}},'✗ رفض')
                    )
                ))
            ),
            // الفواتير المعتمدة — يشوفها الجميع
            ce('div',{className:'card'},
                ce('div',{className:'ch'},
                    ce('h3',null,'✅ الفواتير المعتمدة'),
                    ce('span',{className:'badge bg-g'},approved.length)
                ),
                approved.length===0
                    ?ce('div',{className:'cb'},ce(Empty,{icon:'💰',txt:'لا توجد فواتير معتمدة بعد'}))
                    :approved.map(r=>ce('div',{key:r.id,style:{padding:'14px 16px',borderBottom:'1px solid #f5f7fa'}},
                        ce('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}},
                            ce('div',{style:{flex:1}},
                                ce('div',{style:{fontSize:13,fontWeight:700,color:'#1e293b',marginBottom:3}},r.title),
                                r.description&&ce('div',{style:{fontSize:11,color:'#64748b',marginBottom:6}},r.description),
                                ce('div',{style:{display:'flex',gap:6,flexWrap:'wrap'}},
                                    ce('span',{style:{background:'#dcfce7',color:'#16a34a',padding:'3px 10px',borderRadius:20,fontSize:11,fontWeight:800}},parseFloat(r.amount||0).toLocaleString()+' ريال'),
                                    r.work_date&&ce('span',{style:{background:'#f1f5f9',color:'#64748b',padding:'3px 10px',borderRadius:20,fontSize:11}},r.work_date),
                                    r.invoice_note&&ce('span',{style:{background:'#fef3c7',color:'#d97706',padding:'3px 10px',borderRadius:20,fontSize:11}},r.invoice_note),
                                    r.approved_by&&ce('span',{style:{background:'#eff6ff',color:'#3b82f6',padding:'3px 10px',borderRadius:20,fontSize:10}},'اعتمد: '+r.approved_by)
                                )
                            ),
                            ce('div',{style:{marginRight:8,fontSize:11,color:'#94a3b8',textAlign:'left',flexShrink:0}},
                                new Date(r.created_at).toLocaleDateString('ar',{day:'numeric',month:'short'})
                            )
                        )
                    ))
            )
        );
    };

    // ── HOA MANAGE ──────────────────────────────────────────────────────
    const ManageTab=()=>{
        const [mtab,setMtab]=useState('accounts');
        const used=managed.length,total=user.allowed_units||0;
        const pct=total?Math.round((used/total)*100):0;
        return ce('div',null,
            ce('div',{className:'tab-row'},
                ce('button',{className:`tbtn ${mtab==='accounts'?'on':''}`,onClick:()=>setMtab('accounts')},'👥 الحسابات'),
                ce('button',{className:`tbtn ${mtab==='add'?'on':''}`,onClick:()=>setMtab('add')},'➕ إضافة'),
                ce('button',{className:`tbtn ${mtab==='transfer'?'on':''}`,onClick:()=>setMtab('transfer')},'🏠 انتقال الملكية')
            ),
            mtab==='accounts'&&ce('div',null,
                ce('div',{className:'card'},
                    ce('div',{className:'ch'},ce('h3',null,'📊 الوحدات')),
                    ce('div',{className:'cb'},
                        ce('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:7,fontSize:13}},
                            ce('span',{style:{color:'#64748b'}},'مضافة'),
                            ce('span',{style:{fontWeight:800,color:'#3b82f6'}},`${used} / ${total}`)
                        ),
                        ce('div',{className:'prog-wrap'},ce('div',{className:'prog-bar',style:{width:pct+'%',background:pct>=90?'#ef4444':'#3b82f6'}})),
                        ce('div',{style:{fontSize:11,color:'#94a3b8',marginTop:5}},pct+'% مستخدم')
                    )
                ),
                managed.length>0&&ce('div',{className:'card'},
                    ce('div',{className:'ch'},ce('h3',null,'الحسابات'),ce(Badge,{cls:'bg-b',txt:managed.length})),
                    ...managed.map(m=>ce('div',{key:m.id,className:'li'},
                        ce('div',{className:'li-l'},
                            ce('div',{className:'lic',style:{background:'#eff6ff'}},m.role==='owner'?'🏠':'🔧'),
                            ce('div',null,ce('div',{className:'lit'},'وحدة '+m.unit),ce('div',{className:'lis'},m.role==='owner'?'مالك':'مقاول'))
                        ),
                        ce(Badge,{cls:m.role==='owner'?'bg-b':'bg-g',txt:m.role==='owner'?'مالك':'مقاول'})
                    ))
                )
            ),
            mtab==='add'&&ce('div',{className:'card'},
                ce('div',{className:'ch'},ce('h3',null,'➕ حساب جديد')),
                ce('div',{className:'cb'},
                    ce('form',{onSubmit:createAcc},
                        ce('input',{className:'f-input',value:hoaForm.unit,onChange:e=>setHoaForm({...hoaForm,unit:e.target.value}),placeholder:'رقم الشقة',required:true}),
                        ce('input',{className:'f-input',value:hoaForm.password_code,onChange:e=>setHoaForm({...hoaForm,password_code:e.target.value}),placeholder:'الرمز السري',required:true}),
                        ce('select',{className:'f-input',value:hoaForm.role,onChange:e=>setHoaForm({...hoaForm,role:e.target.value}),style:{marginBottom:12}},
                            ce('option',{value:'owner'},'👤 مالك وحدة'),
                            ce('option',{value:'contractor'},'🔧 مقاول')
                        ),
                        ce('button',{type:'submit',className:'btn btn-green'},'💾 حفظ الحساب')
                    )
                )
            ),
            mtab==='transfer'&&ce('div',null,
                ce('div',{className:'card'},
                    ce('div',{className:'ch'},ce('h3',null,'🏠 انتقال ملكية وحدة')),
                    ce('div',{className:'cb'},
                        ce('div',{className:'alert alert-info',style:{marginBottom:14}},ce('span',null,'ℹ️ عند بيع الوحدة، يتم نقل جميع الوثائق والسجل التاريخي للمالك الجديد')),
                        ce('input',{className:'f-input',placeholder:'رقم الوحدة...'}),
                        ce('input',{className:'f-input',placeholder:'اسم المالك الجديد...'}),
                        ce('input',{className:'f-input',placeholder:'رقم العقد / الصك...'}),
                        ce('button',{className:'btn btn-amber',style:{marginTop:4}},'🔄 بدء إجراءات النقل')
                    )
                ),
                ce('div',{className:'card'},
                    ce('div',{className:'ch'},ce('h3',null,'📋 خطوات انتقال الملكية')),
                    ce('div',{className:'cb'},
                        ce('div',{className:'transfer-steps'},
                            ...[
                                {n:1,t:'تحقق من هوية المشتري',s:'رفع الهوية الوطنية أو الإقامة'},
                                {n:2,t:'مراجعة سجل الصيانة',s:'التحقق من المدفوعات والطلبات المعلقة'},
                                {n:3,t:'توقيع نموذج النقل',s:'توقيع رقمي من البائع والمشتري'},
                                {n:4,t:'نقل الوثائق',s:'تحويل جميع المخططات والوثائق'},
                                {n:5,t:'تفعيل حساب المالك الجديد',s:'إنشاء حساب جديد وإلغاء القديم'},
                            ].map(s=>ce('div',{key:s.n,className:'transfer-step'},
                                ce('div',{className:'step-num'},s.n),
                                ce('div',null,ce('div',{className:'step-text'},s.t),ce('div',{className:'step-sub'},s.s))
                            ))
                        )
                    )
                )
            )
        );
    };

    const content={home:ce(HomeTab),docs:ce(DocsTab),ticket:ce(TicketTab),mreports:ce(MReportsTab),vote:ce(VoteTab),visitor:ce(VisitorTab),security:ce(SecurityTab),manage:ce(ManageTab)};

    return ce('div',{className:'app-shell'},
        ce('div',{className:'top-nav'},
            ce('div',{className:'nav-brand'},
                ce('span',null,'🏢'),
                ce('span',null,'المبنى الرقمي'),
                ce('span',{className:'nav-badge',style:{background:roleColor+'22',color:roleColor}},roleLabel)
            ),
            ce('button',{className:'nav-logout',onClick:handleLogout},'خروج')
        ),
        ce('div',{className:'content'},
            notif.msg&&ce(Alert,{type:notif.type,msg:notif.msg,onClose:()=>setNotif({type:'',msg:''})}),
            content[tab]||ce(HomeTab)
        ),
        ce('div',{className:'bottom-nav'},
            ...tabs.map(tb=>ce('button',{key:tb.id,className:`btab ${tab===tb.id?'on':''}`,onClick:()=>setTab(tb.id)},
                ce('span',{className:'ti2'},tb.icon),
                tb.label
            ))
        )
    );
}

const var_light='#f8fafc';
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(ce(App));
</script>
</body>
</html>
