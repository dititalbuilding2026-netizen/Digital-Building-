<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المبنى الرقمي - بوابة الخدمات</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Arabic', sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .card { background: #fff; padding: 24px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; maxWidth: 400px; text-align: center; }
        input, select { width: 100%; padding: 12px; margin-bottom: 14px; border: 2px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; font-family: inherit; font-size: 14px; transition: 0.3s; }
        input:focus, select:focus { border-color: #3b82f6; outline: none; }
        label { font-size: 13px; color: #64748b; display: block; text-align: right; margin-bottom: 6px; font-weight: bold; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: #fff; border: none; border-radius: 50px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 15px; margin-top: 10px; }
        .error { color: #ef4444; font-weight: bold; margin-bottom: 14px; font-size: 13px; text-align: center; background: #fef2f2; padding: 10px; border-radius: 10px; border: 1px solid #fee2e2; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card" id="login-screen">
        <span style="font-size: 40px;">🏢</span>
        <h2 style="color: #1e293b; margin: 10px 0 0; font-weight: 900;">المبنى الرقمي</h2>
        <p style="color: #64748b; font-size: 12px; margin: 4px 0 20px;">بوابتك الذكية لإدارة عقارك</p>
        
        <div class="error hidden" id="error-msg"></div>

        <form id="login-form">
            <label>الدور / الصفة</label>
            <select id="role">
                <option value="owner">👤 مالك الوحدة</option>
                <option value="hoa">👑 مدير اتحاد الملاك</option>
                <option value="contractor">🔧 مقاول الصيانة</option>
            </select>

            <div id="property-type-block">
                <label>نوع السكن</label>
                <select id="property_type">
                    <option value="building">🏢 عمارة</option>
                    <option value="compound">🏡 كمباوند</option>
                </select>
            </div>

            <div>
                <label id="building-label">اسم / رقم العمارة</label>
                <input type="text" id="building_id" placeholder="مثال: 12" required>
            </div>

            <div id="unit-block">
                <label>رقم الشقة / الوحدة</label>
                <input type="text" id="unit" placeholder="مثال: 5">
            </div>

            <div>
                <label>الرمز السري للدخول</label>
                <input type="password" id="password_code" placeholder="🔑 أدخل الرمز السري" required>
            </div>
            
            <button type="submit" id="submit-btn">🚪 تسجيل الدخول</button>
        </form>
    </div>

    <div class="card" id="main-screen" style="display: none; max-width: 500px; text-align: right;">
        <div style="background: #1e293b; color: #fff; padding: 16px; border-radius: 16px; text-align: center; margin-bottom: 16px;">
            <h3 style="margin: 0; font-size: 16px;">مرحباً بك في مبناك الرقمي 🎉</h3>
            <p id="user-info" style="margin: 4px 0 0; font-size: 12px; color: #94a3b8;"></p>
        </div>
        <div id="financial-status" style="background: #f0fdf4; color: #10b981; padding: 12px; border-radius: 10px; font-weight: bold; text-align: center; font-size: 13px; border: 1px solid #bbf7d0; margin-bottom: 15px;">
            💰 رسوم اتحاد الملاك مسددة بالكامل لعام 2026م.
        </div>
        <button onclick="location.reload()" style="background: #1e293b; margin-top: 20px;">🚪 تسجيل الخروج</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
